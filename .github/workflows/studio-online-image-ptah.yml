name: Creative Studio Online Image and Video

on:
  push:
    branches: [main, studio/main-ptah-acceptance-20261018, studio/online-image-ptah-20261018]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      REPLICATE_API_TOKEN: ''
      TTG_STUDIO_ENABLE_PAID_IMAGE: '0'
      TTG_STUDIO_ENABLE_PAID_VIDEO: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux codecs and Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Windows codecs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (!(Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            throw "FFprobe unavailable"
          }
      - name: Install UI dependencies only, no model checkpoints
        run: python -m pip install PyQt6==6.10.0 Pillow==11.3.0
      - name: Image provider protocol tests, no live calls
        run: python -B scripts/test_online_image_provider.py
      - name: Video provider protocol tests, no live calls
        run: python -B scripts/test_online_video_provider.py
      - name: Shared video contract
        run: python -B scripts/test_video_agent_contract.py
      - name: Standalone video editing
        run: python -B scripts/test_standalone_video.py
      - name: Native image enhancement, masking and canonical autosave recovery
        run: python -B scripts/test_studio_completion.py
      - name: Campaign Designer regressions
        run: python -B scripts/test_campaign_designer.py
      - name: No tracked model weights
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(safetensors|ckpt|gguf|pt|pth)$'; then
            echo "Unexpected model weights tracked" >&2
            exit 1
          fi
