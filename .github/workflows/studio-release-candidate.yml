name: Creative Studio Standalone Release Candidate

on:
  push:
    branches: [main, studio/production-preflight-20261015, studio/direct-local-vision-20261017]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux Qt and media prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 ffmpeg
      - name: Install app and packaging dependencies
        run: python -m pip install Pillow==11.3.0 PyQt6==6.10.0 pyinstaller==6.16.0 imageio-ffmpeg==0.6.0
      - name: Run core and new capability regressions
        run: |
          python -B scripts/test_studio_completion.py
          python -B scripts/test_visual_understanding.py
          python -B scripts/self_test_image_intelligence.py
          python -B scripts/test_campaign_designer.py
          python -B scripts/test_release_packaging.py
          python -B scripts/test_builder_manifest.py
          python -B scripts/test_production_preflight.py
          python -B scripts/test_signed_release_gate.py
          python -B scripts/test_release_decision_boundaries.py
          python -B scripts/test_studio_g0_artifacts.py
          python -B scripts/test_studio_release_manifest.py
          python -B scripts/test_studio_g4_stress.py
          python -B scripts/test_studio_atomic_mp4.py
          python -B scripts/test_studio_atomic_project_save.py
          python -B scripts/test_studio_audio_duration.py
          python -B scripts/test_frozen_gui_probe.py
          python -B scripts/verify_campaign_showcase.py
      - name: Build independent one-folder desktop executable
        run: python -m PyInstaller --noconfirm --clean "TTG Creative Studio.spec"
      - name: Windows compiled desktop smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Resolve-Path ".\dist\TTG Creative Studio\TTG Creative Studio.exe"
          $process = Start-Process -FilePath $binary.Path -ArgumentList "--self-check" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen Windows Studio self-check failed with exit code $($process.ExitCode)" }
      - name: Linux compiled desktop smoke
        if: runner.os == 'Linux'
        run: |
          "dist/TTG Creative Studio/TTG Creative Studio" --self-check
          mkdir -p "$RUNNER_TEMP/studio-gui-proof-linux"
          "dist/TTG Creative Studio/TTG Creative Studio" --qualify-gui "$RUNNER_TEMP/studio-gui-proof-linux"
          python -B scripts/verify_frozen_gui_proof.py "$RUNNER_TEMP/studio-gui-proof-linux"
          python -B scripts/install_linux_portable.py "dist/TTG Creative Studio" --prefix "$RUNNER_TEMP/studio-prefix"
          "$RUNNER_TEMP/studio-prefix/bin/ttg-creative-studio" --self-check
          mkdir -p "$RUNNER_TEMP/studio-gui-installed-linux"
          "$RUNNER_TEMP/studio-prefix/bin/ttg-creative-studio" --qualify-gui "$RUNNER_TEMP/studio-gui-installed-linux"
          python -B scripts/verify_frozen_gui_proof.py "$RUNNER_TEMP/studio-gui-installed-linux"
          tar -C dist -czf "$RUNNER_TEMP/TTG-Creative-Studio-Linux-x64.tar.gz" "TTG Creative Studio"
          python -B scripts/studio_release_manifest.py create --kind linux --artifact "$RUNNER_TEMP/TTG-Creative-Studio-Linux-x64.tar.gz" --manifest "$RUNNER_TEMP/studio-linux-custody.json" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          python -B scripts/studio_release_manifest.py verify --artifact "$RUNNER_TEMP/TTG-Creative-Studio-Linux-x64.tar.gz" --manifest "$RUNNER_TEMP/studio-linux-custody.json" --source-sha "$GITHUB_SHA"
      - name: Build Windows Inno Setup installation package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & ".\build_installer.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer compilation failed" }
      - name: Validate signing scripts and reject unsigned release approval
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("sign_release.ps1", "scripts/verify_signed_installer.ps1")) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parse failure in $file" }
          }
          $installer = "dist/installer/TTG-Creative-Studio-Core-Setup.exe"
          $before = (Get-FileHash -Algorithm SHA256 $installer).Hash
          Remove-Item Env:TTG_STUDIO_SIGNING_PFX -ErrorAction SilentlyContinue
          Remove-Item Env:TTG_STUDIO_SIGNING_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:TTG_STUDIO_EXPECTED_SIGNER_THUMBPRINT -ErrorAction SilentlyContinue
          $blocked = $false
          try { & ".\sign_release.ps1" } catch { $blocked = $true }
          if (!$blocked) { throw "Unsigned package was improperly admitted for signing" }
          $after = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($before -ne $after) { throw "Denied signing path altered the installer" }
      - name: Install, execute and uninstall actual Windows app candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\scripts\test_installer_windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Installer lifecycle smoke failed" }
          python -B scripts/studio_release_manifest.py create --kind windows --artifact "dist/installer/TTG-Creative-Studio-Core-Setup.exe" --manifest "$env:RUNNER_TEMP/studio-windows-custody.json" --source-sha "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw "Windows release custody manifest failed" }
          python -B scripts/studio_release_manifest.py verify --artifact "dist/installer/TTG-Creative-Studio-Core-Setup.exe" --manifest "$env:RUNNER_TEMP/studio-windows-custody.json" --source-sha "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Windows release manifest recheck failed" }
      - name: Publish Windows unsigned installer candidate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TTG-Creative-Studio-Windows-unsigned
          path: dist/installer/TTG-Creative-Studio-Core-Setup.exe
          if-no-files-found: error
      - name: Upload Linux frozen and installed GUI proof
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: TTG-Creative-Studio-Linux-GUI-proof
          path: ${{ runner.temp }}/studio-gui-installed-linux/
          if-no-files-found: error
      - name: Upload Windows real installed GUI proof
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TTG-Creative-Studio-Windows-Installed-GUI-proof
          path: ${{ runner.temp }}/studio-installed-gui-proof-windows/
          if-no-files-found: error
      - name: Publish Windows release candidate identity (not signed)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TTG-Creative-Studio-Windows-custody
          path: ${{ runner.temp }}/studio-windows-custody.json
          if-no-files-found: error
      - name: Publish Linux release candidate identity (not signed)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: TTG-Creative-Studio-Linux-custody
          path: ${{ runner.temp }}/studio-linux-custody.json
          if-no-files-found: error
      - name: Publish portable Linux candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: TTG-Creative-Studio-Linux-portable
          path: ${{ runner.temp }}/TTG-Creative-Studio-Linux-x64.tar.gz
          if-no-files-found: error
