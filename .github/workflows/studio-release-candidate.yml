name: Creative Studio Standalone Release Candidate

on:
  push:
    branches: [studio/release-capabilities-20261015]
  pull_request:
    branches: [studio/campaign-designer-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux Qt and media prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 ffmpeg
      - name: Install app and packaging dependencies
        run: python -m pip install Pillow==11.3.0 PyQt6==6.10.0 pyinstaller==6.16.0
      - name: Run core and new capability regressions
        run: |
          python -B scripts/test_studio_completion.py
          python -B scripts/test_campaign_designer.py
          python -B scripts/test_release_packaging.py
          python -B scripts/verify_campaign_showcase.py
      - name: Build independent one-folder desktop executable
        run: python -m PyInstaller --noconfirm --clean "TTG Creative Studio.spec"
      - name: Windows compiled desktop smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Resolve-Path ".\dist\TTG Creative Studio\TTG Creative Studio.exe"
          $process = Start-Process -FilePath $binary.Path -ArgumentList "--self-check" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen Windows Studio self-check failed with exit code $($process.ExitCode)" }
      - name: Linux compiled desktop smoke
        if: runner.os == 'Linux'
        run: |
          "dist/TTG Creative Studio/TTG Creative Studio" --self-check
          python -B scripts/install_linux_portable.py "dist/TTG Creative Studio" --prefix "$RUNNER_TEMP/studio-prefix"
          "$RUNNER_TEMP/studio-prefix/bin/ttg-creative-studio" --self-check
          tar -C dist -czf "$RUNNER_TEMP/TTG-Creative-Studio-Linux-x64.tar.gz" "TTG Creative Studio"
      - name: Build Windows Inno Setup installation package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & ".\build_installer.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer compilation failed" }
      - name: Publish Windows unsigned installer candidate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TTG-Creative-Studio-Windows-unsigned
          path: dist/installer/TTG-Creative-Studio-Core-Setup.exe
          if-no-files-found: error
      - name: Publish portable Linux candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: TTG-Creative-Studio-Linux-portable
          path: ${{ runner.temp }}/TTG-Creative-Studio-Linux-x64.tar.gz
          if-no-files-found: error
