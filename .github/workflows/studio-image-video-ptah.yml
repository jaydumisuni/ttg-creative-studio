name: Creative Studio Image and Video Online/Workspace Contracts

on:
  push:
    branches: [studio/image-video-ptah-20261018]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  online-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      REPLICATE_API_TOKEN: ''
      TTG_STUDIO_ENABLE_PAID_IMAGE: '0'
      TTG_STUDIO_ENABLE_PAID_VIDEO: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: FFmpeg and Qt libraries on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: FFmpeg and FFprobe on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) -or
              !(Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (!(Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            throw 'FFprobe unavailable'
          }
      - name: Install GUI dependencies only
        run: python -m pip install PyQt6==6.10.0 Pillow==11.3.0
      - name: Test online image provider without billing
        run: python -B scripts/test_online_image_provider.py
      - name: Test online video provider without billing
        run: python -B scripts/test_online_video_provider.py
      - name: Test real standalone video and audio
        run: python -B scripts/test_standalone_video.py
      - name: Test native image completion
        run: python -B scripts/test_studio_completion.py
      - name: Confirm no model weights committed
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(safetensors|ckpt|gguf|pt|pth)$'; then
            echo 'Unexpected model weights in Creative Studio repository' >&2
            exit 1
          fi
