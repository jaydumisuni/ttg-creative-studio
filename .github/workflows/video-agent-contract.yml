name: Creative Studio Shared Video Agent Contract

on:
  push:
    branches: [studio/agent-video-contract-20261018]
  pull_request:
    branches: [main]
    paths:
      - 'src/ttg_creative_studio/**'
      - 'src/ttg_visual_understanding.py'
      - 'scripts/test_video_agent_contract.py'
      - 'docs/VIDEO_AGENT_CONTRACT_V1.md'
      - 'docs/HUNTER_CREATIVE_ENGINE_V1.md'
      - '.github/workflows/video-agent-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-contract:
    name: Shared AI video contract · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg on Windows when missing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (!(Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            throw "ffprobe missing after FFmpeg installation"
          }
      - name: Install minimal runtime dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Validate shared tool catalog
        run: python -B src/ttg_creative_studio/cli.py --catalog
      - name: Run physical FFprobe, visual sampling, storyboard and MP4 proof
        run: python -B scripts/test_video_agent_contract.py
