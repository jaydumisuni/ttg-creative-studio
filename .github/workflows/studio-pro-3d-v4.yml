name: Creative Studio Professional 3D V4 Execution

on:
  push:
    branches: [studio/pro-3d-v4-20261018]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pro-v4:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Blender & Qt Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
          blender --version | head -1
      - name: Runtime dependencies only
        run: python -m pip install PyQt6==6.10.0 Pillow==11.3.0
      - name: Professional V4 native and actual Blender inspection
        run: python -B scripts/test_pro_3d_v4.py
      - name: Existing native and V2/V3 checks
        run: |
          python -B scripts/test_native_3d.py
          python -B scripts/test_advanced_3d.py
          python -B scripts/test_professional_3d.py
          python -B scripts/test_blender_3d.py
      - name: Qualify isolated Blender cloth cache bake and fluid fail-closed guards
        run: python -B scripts/test_simulation_bake.py
      - name: Blender remains an external GPL process
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          assert "import bpy" not in Path("src/ttg_blender_engine.py").read_text()
          p=Path("integrations/blender/gpl_scene_runner.py").read_text()
          assert "SPDX-License-Identifier: GPL-3.0-or-later" in p
          assert "import bpy" in p
          PY
