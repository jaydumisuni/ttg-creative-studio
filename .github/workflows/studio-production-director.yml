name: Creative Studio Native Production Director
on:
  push:
    branches: [studio/autonomous-production-20261020]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-production:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing native renderer dependencies
        run: python -m pip install Pillow==11.3.0 numpy==1.26.4
      - name: Verify Studio-owned production
        run: python -B scripts/test_studio_production_director.py
      - name: Verify assistant scene/edit/campaign execution
        run: python -B scripts/test_creative_instruction_bridge.py
      - name: Verify native instruction planning and bounded pixel correction
        run: python -B scripts/test_creative_intelligence.py
      - name: Verify shared Studio registry
        run: python -B src/ttg_creative_studio/cli.py --catalog
