name: Creative Studio Standalone Video Lab

on:
  push:
    branches: [studio/standalone-video-20261018]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-video:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Video codecs on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Video codecs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) -or
              !(Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (!(Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            throw "FFprobe missing: cannot validate video clips"
          }
      - name: Install Qt and Pillow
        run: python -m pip install PyQt6==6.10.0 Pillow==11.3.0
      - name: Verify native video, clip import, GUI, audio, exported video
        run: python -B scripts/test_standalone_video.py
      - name: Verify shared video job regressions
        run: python -B scripts/test_video_agent_contract.py
      - name: Verify existing Campaign Designer
        run: python -B scripts/test_campaign_designer.py
