name: Creative Studio Campaign Designer

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ttg_campaign_*.py'
      - 'src/ttg_creative_workspace.py'
      - 'src/ttg_creative_app.py'
      - 'src/ttg_interactive_canvas.py'
      - 'src/ttg_text_renderer.py'
      - 'scripts/*campaign*.py'
      - 'scripts/creative_cli.py'
      - 'examples/campaigns/**'
      - '.github/workflows/ci.yml'
  push:
    branches: ['studio/campaign-designer-v1']
    paths:
      - 'src/ttg_campaign_*.py'
      - 'src/ttg_creative_workspace.py'
      - 'src/ttg_creative_app.py'
      - 'src/ttg_interactive_canvas.py'
      - 'src/ttg_text_renderer.py'
      - 'scripts/*campaign*.py'
      - 'scripts/creative_cli.py'
      - 'examples/campaigns/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-campaign-workflow:
    name: Campaigns and GUI · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Linux Qt offscreen shared-library prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Install standalone minimum editor dependencies
        run: python -m pip install Pillow==11.3.0 PyQt6==6.10.0
      - name: Validate Python source syntax
        run: python -m compileall -q src scripts
      - name: Validate committed editable campaigns
        run: python -B scripts/verify_campaign_showcase.py
      - name: Prove all layouts, responsive UI, asset relocation and export
        run: python -B scripts/test_campaign_designer.py
      - name: Verify established offscreen editor workflow
        run: python -B scripts/self_test_ui_offscreen.py
      - name: Verify native editing actions
        run: python -B scripts/test_editing_actions.py
